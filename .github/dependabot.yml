version: 2

# Workflow actions are pinned to immutable commit SHAs, which means they never
# pick up upstream fixes on their own. Dependabot is what keeps those pins from
# rotting: without it, pinning trades a supply-chain risk for a stale-dependency
# one. It opens a PR when a newer release exists, and the test matrix in
# tests.yml gates that PR like any other change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
